services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Shutdown lets a smart-home scene finish and drains the alert queue; Docker's default 10 s is too tight.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
